# Spring Boot backend port
server.port=8080

# XAMPP MySQL/MariaDB connection settings
# Start MySQL in XAMPP before running the backend.
# Database name: sales_analytics_db
# Default XAMPP credentials are usually username root and an empty password.
spring.datasource.url=jdbc:mysql://localhost:3306/sales_analytics_db?useSSL=false&serverTimezone=Asia/Manila&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA settings
# The table is created manually using src/main/resources/database/schema.sql.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
